name: Evaluación RAG

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/eval.yml'
  workflow_dispatch:

jobs:
  run-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generar vectorstore
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        if python scripts/build_vectorstore.py; then
          echo "✅ Vectorstore generado exitosamente"
        else
          echo "❌ Error generando vectorstore - verifica tu OPENAI_API_KEY en GitHub Secrets"
          echo "💡 Ve a Settings → Secrets and variables → Actions"
          echo "💡 Asegúrate de que OPENAI_API_KEY esté configurada correctamente"
          exit 1
        fi

    - name: Verificar setup del proyecto
      run: |
        python scripts/verify_setup.py

    - name: Verificar API Key
      id: check-api-key
      run: |
        if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
          echo "api_key_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ OPENAI_API_KEY no configurada. Saltando evaluación."
        else
          echo "api_key_exists=true" >> $GITHUB_OUTPUT
          echo "✅ OPENAI_API_KEY configurada. Ejecutando evaluación."
        fi

    - name: Ejecutar evaluación
      if: steps.check-api-key.outputs.api_key_exists == 'true'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python app/run_eval.py

    - name: Saltar evaluación
      if: steps.check-api-key.outputs.api_key_exists == 'false'
      run: |
        echo "🔄 Evaluación saltada - configura OPENAI_API_KEY en GitHub Secrets para ejecutar evaluaciones completas"
