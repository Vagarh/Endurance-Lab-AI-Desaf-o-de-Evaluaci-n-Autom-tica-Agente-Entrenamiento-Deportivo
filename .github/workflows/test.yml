name: Tests

on:
  push:
    paths:
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generar vectorstore para tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        if python scripts/build_vectorstore.py; then
          echo "✅ Vectorstore real generado exitosamente"
        else
          echo "⚠️ No se pudo generar vectorstore real, usando mock para tests"
          python scripts/create_mock_vectorstore.py
        fi

    - name: Verificar setup del proyecto
      run: |
        python scripts/verify_setup.py

    - name: Ejecutar pytest
      run: |
        pytest tests/test_run_eval.py -v
